name: deepseek-v2-lite-validation
model:
  path: ${MODEL_ROOT}/DeepSeek-V2-Lite
  family: deepseek
  kind: moe
  trust_remote_code: true
methods: [rose_2_4, rose_channel]
backends: [cusparselt, cublas]
calibration:
  dataset: ${DATA_ROOT}/c4
  samples: 1
  sequence_length: 128
evaluation:
  dataset: ${DATA_ROOT}/wikitext/wikitext-2-raw-v1
  max_tokens_smoke: 128
  generation_prompts: [Sparse mixture-of-experts models are useful because]
pruning:
  sparsity_ratio: 0.5
  channel_ratio: 0.25
  only_moe: true
workload:
  profile: interactive
  batch_sizes: [1]
  input_lengths: [128]
  output_lengths: [8]
  warmup: 2
  iterations: 3
execution:
  device: cuda:0
  offline: true
output_dir: ${RUN_ROOT}

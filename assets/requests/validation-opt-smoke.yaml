name: opt-125m-validation
model:
  path: ${MODEL_ROOT}/opt-125m
  family: opt
  kind: dense
methods: [wanda_2_4]
backends: [transformers, cusparselt]
calibration:
  dataset: ${DATA_ROOT}/c4
  samples: 8
  sequence_length: 128
evaluation:
  dataset: ${DATA_ROOT}/wikitext/wikitext-2-raw-v1
  max_tokens_smoke: 512
workload:
  profile: interactive
  batch_sizes: [1]
  input_lengths: [128]
  output_lengths: [8]
  warmup: 2
  iterations: 3
execution:
  device: cuda:0
  offline: true
output_dir: ${RUN_ROOT}

name: opt-125m-smoothquant-validation
model:
  path: ${MODEL_ROOT}/opt-125m
  family: opt
  kind: dense
methods: [smoothquant_w8a8]
backends: [transformers, vllm]
calibration:
  dataset: ${DATA_ROOT}/c4
  samples: 8
  sequence_length: 128
  seed: 43
evaluation:
  dataset: ${DATA_ROOT}/wikitext/wikitext-2-raw-v1
  max_tokens_smoke: 512
  generation_prompts: [The future of efficient language model inference is]
workload:
  profile: interactive
  batch_sizes: [1]
  input_lengths: [128]
  output_lengths: [8]
  warmup: 1
  iterations: 2
execution:
  device: cuda:0
  offline: true
  timeout_seconds: 1800
output_dir: ${RUN_ROOT}
